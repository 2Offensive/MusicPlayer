<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Library Player</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

<canvas id="visualizer"></canvas>

<div class="library" id="library"></div>

<div class="player">
  <div class="cover" id="cover"></div>

  <div class="controls-area">
    <h2 id="title">Select a song</h2>
    <div class="meta" id="albumName"></div>

    <input type="range" id="progress" value="0">

    <div class="controls">
      <button id="shuffleBtn" onclick="toggleShuffle()"><span class="material-icons">shuffle</span></button>
      <button onclick="prev()"><span class="material-icons">skip_previous</span></button>
      <button class="play-btn" onclick="playPause()"><span class="material-icons" id="playIcon">play_arrow</span></button>
      <button onclick="next()"><span class="material-icons">skip_next</span></button>
      <button id="repeatBtn" onclick="toggleRepeat()"><span class="material-icons">repeat</span></button>
      <button onclick="toggleQueue()"><span class="material-icons">queue_music</span></button>
    </div>

    <div class="meta">Volume</div>
    <input type="range" min="0" max="1" step="0.01" id="volume">
  </div>
</div>

<div class="queue" id="queue">
  <div class="queue-header">
    <span>Queue</span>
    <button class="queue-close" onclick="toggleQueue()">✕</button>
  </div>
</div>

<audio id="audio" crossorigin="anonymous"></audio>
<script src="script.js"></script>
</body>
</html>
